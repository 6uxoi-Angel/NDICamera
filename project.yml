name: NDICamera
options:
  bundleIdPrefix: dev.ndicamera
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    INFOPLIST_KEY_CFBundleDisplayName: NDI Camera
targets:
  NDICamera:
    type: application
    platform: iOS
    sources:
      - path: src
        excludes:
          - Info.plist
    info:
      path: src/Info.plist
      properties:
        NSCameraUsageDescription: "Камера используется для передачи видео в OBS по NDI."
        NSMicrophoneUsageDescription: "Микрофон используется для передачи звука в OBS по NDI."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ndicamera.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера используется для передачи видео в OBS по NDI."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон используется для передачи звука в OBS по NDI."
        OTHER_LDFLAGS: [ "$(inherited)", "-ObjC", "-lndi_ios", "-framework", "VideoToolbox", "-framework", "AVFoundation", "-framework", "Accelerate", "-framework", "Security" ]
        LIBRARY_SEARCH_PATHS: [ "$(PROJECT_DIR)/NDISDK/iOS" ]
        HEADER_SEARCH_PATHS: [ "$(PROJECT_DIR)/NDISDK/include" ]
        SWIFT_OBJC_BRIDGING_HEADER: src/BridgingHeader.h
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_PRECOMPILE_PREFIX_HEADER: NO
        LD_RUNPATH_SEARCH_PATHS: [ "$(inherited)", "@executable_path/Frameworks" ]
